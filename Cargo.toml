[workspace]
members = [
    "crates/syntax",
    "crates/binder",
    "crates/types",
    "crates/host",
    "crates/program",
    "crates/emitter",
    "crates/compiler",
    "crates/incremental",
    "crates/checker",
    "crates/diagnostics",
    "crates/harness",
    "crates/conformance",
    "crates/xtask",
    "crates/api",
    "crates/project",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
iter_over_hash_type = "deny"

# Stable dependency aliases live here so a package rename only changes the
# renamed package manifest and this one mapping. Member manifests inherit the
# aliases and Rust `use` paths can remain unchanged.
[workspace.dependencies]
tsc-api = { package = "tsc-rs-api", path = "crates/api" }
tsc-binder = { package = "tsc-rs-binder", path = "crates/binder" }
tsc-checker = { package = "tsc-rs-checker", path = "crates/checker" }
tsc-compiler = { package = "tsc-rs-compiler", path = "crates/compiler" }
tsc-conformance = { package = "tsc-rs-conformance", path = "crates/conformance" }
tsc-diagnostics = { package = "tsc-rs-diagnostics", path = "crates/diagnostics" }
tsc-emitter = { package = "tsc-rs-emitter", path = "crates/emitter" }
tsc-harness = { package = "tsc-rs-harness", path = "crates/harness" }
tsc-host = { package = "tsc-rs-host", path = "crates/host" }
tsc-incremental = { package = "tsc-rs-incremental", path = "crates/incremental" }
tsc-program = { package = "tsc-rs-program", path = "crates/program" }
tsc-project = { package = "tsc-rs-project", path = "crates/project" }
tsc-syntax = { package = "tsc-rs-syntax", path = "crates/syntax" }
tsc-types = { package = "tsc-rs-types", path = "crates/types" }
sha2 = "0.10"
libc = "0.2"
rustc-hash = "2.1"
self_cell = "1"

# Test failures retain Rust backtraces and assertion context without embedding
# full DWARF/PDB data in every large integration binary. This materially
# reduces local link and process-startup I/O while leaving dev binaries
# debuggable under the ordinary profile.
# Release binaries are what the parity benchmarks and users run: whole-program
# LTO and a single codegen unit let the cross-crate accessors (arena/binder
# routing, links tables) inline into their hot callers.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.test]
debug = 0

# The dev profile runs the tests; unoptimized parse/bind/check made the
# corpus-wide ones ~9x slower than release. Optimize the compute crates while
# keeping dev's debug-assertions (invariant checks stay on). The list follows
# the `dev-profile-opt-level` metadata of the member manifests.
[profile.dev.package.tsc-rs-binder]
opt-level = 3
[profile.dev.package.tsc-rs-checker]
opt-level = 3
[profile.dev.package.tsc-rs-conformance]
opt-level = 3
[profile.dev.package.tsc-rs-diagnostics]
opt-level = 3
[profile.dev.package.tsc-rs-emitter]
opt-level = 3
[profile.dev.package.tsc-rs-harness]
opt-level = 3
[profile.dev.package.tsc-rs-syntax]
opt-level = 3
[profile.dev.package.tsc-rs-types]
opt-level = 3
