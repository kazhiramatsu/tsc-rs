[package]
name = "tsc-rs-types"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "types"
dev-profile-opt-level = 3

[lib]
name = "tsc_types"
path = "src/lib.rs"

[features]
# Aggregate performance counters (measurement builds only; see src/perf.rs).
perf-counters = []

[dependencies]
tsc-diagnostics.workspace = true

[lints]
workspace = true
