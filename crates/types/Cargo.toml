[package]
name = "tsc-rs-types"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "types"
dev-profile-opt-level = 3

[lib]
name = "tsc_types"
path = "src/lib.rs"

[features]
# Aggregate performance counters (measurement builds only; see src/perf.rs).
perf-counters = []

[dependencies]
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }
rustc-hash.workspace = true
tsc-diagnostics.workspace = true
# `--generateTrace` names a file's thread by tsgo's xxh3 hash of it.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[lints]
workspace = true
