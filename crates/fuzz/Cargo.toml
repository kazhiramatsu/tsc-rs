[package]
name = "tsc-rs-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "tsc-rs-fuzz-producer"

[package.metadata.tsc-rs]
role = "fuzz"

[lib]
name = "tsc_fuzz"
path = "src/lib.rs"

[[bin]]
name = "tsc-rs-fuzz-producer"
path = "src/bin/tsc-rs-fuzz-producer.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml_edit = "0.22"
tsc-checker.workspace = true
tsc-diagnostics.workspace = true
tsc-harness.workspace = true
