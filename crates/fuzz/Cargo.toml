[package]
name = "tsrs2-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tsrs2_fuzz"
path = "src/lib.rs"

[[bin]]
name = "tsrs2-fuzz-producer"
path = "src/bin/tsrs2-fuzz-producer.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml_edit = "0.22"
tsrs2-checker = { path = "../checker" }
tsrs2-diags = { path = "../diags" }
tsrs2-harness = { path = "../harness" }
