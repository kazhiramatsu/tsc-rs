[package]
name = "tsc-rs-harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "harness"
dev-profile-opt-level = 3

[lib]
name = "tsc_harness"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tsc-checker.workspace = true
