[package]
name = "tsc-rs-binder"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "binder"
dev-profile-opt-level = 3

[lib]
name = "tsc_binder"
path = "src/lib.rs"

[features]
# Measurement builds only: name-table call-site attribution (see tsc_types::perf).
perf-counters = ["tsc-types/perf-counters"]

[dependencies]
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }
indexmap = "2"
rustc-hash.workspace = true
tsc-diagnostics.workspace = true
tsc-syntax.workspace = true
tsc-types.workspace = true

[lints]
workspace = true
