[package]
name = "tsc-rs-lsproto"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "lsproto"

# tsgo `lsproto`: the language server protocol's types and messages, shared
# by the server, the language service and the project system.
[lib]
name = "tsc_lsproto"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

[lints]
workspace = true
