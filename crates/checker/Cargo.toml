[package]
name = "tsc-rs-checker"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "checker"
dev-profile-opt-level = 3

[lib]
name = "tsc_checker"
path = "src/lib.rs"

[features]
perf-counters = ["tsc-binder/perf-counters", "tsc-types/perf-counters"]

[dependencies]
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }
indexmap = "2"
rustc-hash.workspace = true
self_cell.workspace = true
tsc-binder.workspace = true
tsc-diagnostics.workspace = true
tsc-emitter.workspace = true
tsc-program.workspace = true
tsc-syntax.workspace = true
tsc-types.workspace = true

[dev-dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }

[lints]
workspace = true
