[package]
name = "tsc-rs-project"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "project"

[lib]
name = "tsc_project"
path = "src/lib.rs"

[dependencies]
# The inferred project's options are written as tsgo's API form.
serde_json = "1.0"
tsc-compiler.workspace = true
tsc-diagnostics.workspace = true
tsc-host.workspace = true
tsc-emitter.workspace = true
tsc-ls.workspace = true
tsc-lsproto.workspace = true
tsc-program.workspace = true
tsc-syntax.workspace = true
tsc-types.workspace = true
# An open document's content hash is tsgo's xxh3-128.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
# tsgo `contentmappertest`: the in-process test mappers.
tsc-harness.workspace = true

[lints]
workspace = true
