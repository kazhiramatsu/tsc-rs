[package]
name = "tsc-rs-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "tsc-rs"

[package.metadata.tsc-rs]
role = "compiler"

[lib]
name = "tsc_compiler"
path = "src/lib.rs"

[[bin]]
name = "tsc-rs"
path = "src/bin/tsc-rs.rs"

[dependencies]
tsc-checker.workspace = true
tsc-diagnostics.workspace = true
tsc-emitter.workspace = true
tsc-host.workspace = true
tsc-program.workspace = true

[dev-dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stats_alloc = "0.1.10"
tsc-harness.workspace = true

[lints]
workspace = true
