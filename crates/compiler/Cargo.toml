[package]
name = "tsc-rs-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "tsc-rs"

[package.metadata.tsc-rs]
role = "compiler"

[lib]
name = "tsc_compiler"
path = "src/lib.rs"

[[bin]]
name = "tsc-rs"
path = "src/bin/tsc-rs.rs"

[features]
# Measurement builds only: aggregate cache/phase counters printed at exit when
# TSRS_PERF_COUNTERS is set (see crates/types/src/perf.rs).
perf-counters = ["tsc-checker/perf-counters", "tsc-types/perf-counters"]

[dependencies]
libmimalloc-sys = { version = "0.1", features = ["extended"] }
mimalloc = "0.1"
tsc-checker.workspace = true
tsc-diagnostics.workspace = true
tsc-emitter.workspace = true
tsc-host.workspace = true
tsc-program.workspace = true
tsc-types.workspace = true

[dev-dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
stats_alloc = "0.1.10"
tsc-harness.workspace = true
tsc-syntax.workspace = true
zstd = "0.13"

[lints]
workspace = true
