[package]
name = "tsc-rs-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "lsp"

[lib]
name = "tsc_lsp"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tsc-api.workspace = true
tsc-compiler.workspace = true
tsc-diagnostics.workspace = true
tsc-host.workspace = true
tsc-ls.workspace = true
tsc-lsproto.workspace = true
tsc-program.workspace = true
tsc-project.workspace = true
tsc-types.workspace = true

[dev-dependencies]
# tsgo `contentmappertest`: the in-process test mappers.
tsc-harness.workspace = true

[lints]
workspace = true
