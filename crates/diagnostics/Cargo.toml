[package]
name = "tsc-rs-diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "diagnostics"
dev-profile-opt-level = 3

[lib]
name = "tsc_diagnostics"
path = "src/lib.rs"

[dependencies]
memchr = "2"

# The store (and its text heap) is 64-bit and native only; on WASM a text is
# a plain `Arc<str>` (src/shared_text_wasm.rs).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tsc-store.workspace = true
