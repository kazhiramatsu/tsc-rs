[package]
name = "tsc-rs-ls"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "ls"

# tsgo `ls`: the language service.
[lib]
name = "tsc_ls"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0"
tsc-binder.workspace = true
tsc-checker.workspace = true
tsc-compiler.workspace = true
tsc-diagnostics.workspace = true
tsc-emitter.workspace = true
tsc-host.workspace = true
tsc-lsproto.workspace = true
tsc-program.workspace = true
tsc-syntax.workspace = true
tsc-types.workspace = true

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true
