[package]
name = "tsc-rs-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.tsc-rs]
role = "conformance"
dev-profile-opt-level = 3

[lib]
name = "tsc_conformance"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml_edit = "0.22"
tsc-checker.workspace = true
tsc-compiler.workspace = true
tsc-diagnostics.workspace = true
tsc-harness.workspace = true
tsc-host.workspace = true
tsc-oracle.workspace = true
tsc-program.workspace = true
zstd = "0.13"
