name: witnesses

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/witness.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witnesses-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  decorator:
    name: decorator witnesses (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [primary, controls, retained]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Replay all primary decorator witnesses
        if: matrix.group == 'primary'
        run: >-
          cargo xtask test compiler --test decorator_super_contract h2_8a_decorator_super::decorator_super_forms_match_complete_typescript_observations -- --exact --test-threads=1
      - name: Replay extra and follow-up decorator witnesses
        if: matrix.group == 'controls'
        run: >-
          cargo xtask test compiler --test decorator_super_contract h2_8a_decorator_super:: -- --skip h2_8a_decorator_super::decorator_super_forms_match_complete_typescript_observations --test-threads=2
      - name: Verify synthetic decorator controls
        if: matrix.group == 'controls'
        run: >-
          cargo xtask test emitter --test decorator_super_direct_contract -- --test-threads=1
      - name: Replay all retained accessor witnesses
        if: matrix.group == 'retained'
        run: >-
          cargo xtask test compiler --test contracts h2_8a_retained_accessor_owners::retained_accessor_owners_match_complete_typescript_observations -- --exact --test-threads=1
