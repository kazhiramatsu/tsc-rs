name: witnesses

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witnesses-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_witnesses: ${{ steps.plan.outputs.has_witnesses }}
      matrix: ${{ steps.plan.outputs.witnesses_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        name: Select affected replay groups
        run: python3 .github/ci/replay.py plan

  witnesses:
    name: witnesses (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.has_witnesses == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.group == 'printer' && 20 || 60 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: ""
      WITNESS_SUITES: ${{ toJSON(matrix.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use the frozen oracle Node version
        if: contains(matrix.suites, 'transpile-routes') || contains(matrix.suites, 'resolution-cache') || contains(matrix.suites, 'literal-update') || contains(matrix.suites, 'literal-update-pipeline')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Run selected witnesses
        run: python3 .github/ci/replay.py witnesses

  witness-gates:
    name: witness-gates
    needs: [plan, witnesses]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPLAY_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every selected group to succeed
        run: python3 .github/ci/replay.py gate witnesses
