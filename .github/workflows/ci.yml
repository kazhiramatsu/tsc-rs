name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit makes an older run irrelevant. Cancelling it frees a
# standard hosted-runner slot immediately and avoids spending public
# repository capacity on stale guardrail work.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep the GitHub-only compile guardrail within two compiler workers. The
  # local full gate remains authoritative and owns lint/tests/semantic work.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # PR merge-ref caches are isolated from other PRs, but READ_WRITE lets a
  # cancelled or manually rerun guardrail reuse objects from its own scope.
  SCCACHE_GHA_RW_MODE: READ_WRITE

jobs:
  # Keep the required `gates` check available for documentation-only PRs
  # without starting Cargo, Node, B2, or full-corpus work. Workflow-level
  # path filters are not used because a skipped required workflow can remain
  # pending under branch protection.
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      host_platform: ${{ steps.diff.outputs.host_platform }}
      node_checks: ${{ steps.diff.outputs.node_checks }}
      program_path: ${{ steps.diff.outputs.program_path }}
      rust_checks: ${{ steps.diff.outputs.rust_checks }}
    steps:
      - name: Checkout enough history for PR path classification
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect validation scope
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # A manual dispatch deliberately exercises the non-doc guardrail.
          docs_only=false
          host_platform=true
          node_checks=true
          program_path=true
          rust_checks=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request \
            && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$BASE_SHA^{commit}" \
            && git cat-file -e "$HEAD_SHA^{commit}"; then
            host_platform=false
            node_checks=false
            program_path=false
            rust_checks=false
            # Whitespace errors fail even the lightweight documentation path.
            git diff --check "$BASE_SHA" "$HEAD_SHA"

            changed_file="$RUNNER_TEMP/changed-paths"
            # Disable rename collapsing so both the removed and added path are
            # classified; renaming a non-Markdown file to `.md` is not docs-only.
            git diff --name-only --no-renames -z \
              "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
            mapfile -d '' changed < "$changed_file"

            docs_only=true
            if (( ${#changed[@]} == 0 )); then
              docs_only=false
            fi
            for path in "${changed[@]}"; do
              if [[ "$path" != *.md ]]; then
                docs_only=false
                case "$path" in
                  *.rs|Cargo.toml|*/Cargo.toml|Cargo.lock|.cargo/config.toml|rust-toolchain.toml)
                    rust_checks=true
                    ;;
                esac
                case "$path" in
                  crates/oracle/*.mjs|.node-version)
                    node_checks=true
                    ;;
                esac
                case "$path" in
                  crates/host/*|crates/program/*)
                    host_platform=true
                    program_path=true
                    ;;
                  .github/workflows/ci.yml|rust-toolchain.toml)
                    host_platform=true
                    program_path=true
                    rust_checks=true
                    node_checks=true
                    ;;
                esac
              fi
            done

            # README's generated status is semantic evidence even though the
            # file is Markdown. A changed, missing, or duplicated block must
            # take the non-doc path; the required local full gate owns its
            # readiness-backed readme-status check.
            status_block() {
              git show "$1:README.md" | awk '
                /<!-- STATUS:BEGIN / {
                  if (inside || begins != 0) exit 2
                  inside = 1
                  begins++
                }
                inside { print }
                /<!-- STATUS:END -->/ {
                  if (!inside) exit 2
                  inside = 0
                  ends++
                }
                END {
                  if (inside || begins != 1 || ends != 1) exit 2
                }
              '
            }
            if [[ "$docs_only" == true ]]; then
              if ! base_status="$(status_block "$BASE_SHA")" \
                || ! head_status="$(status_block "$HEAD_SHA")" \
                || [[ "$base_status" != "$head_status" ]]; then
                docs_only=false
              fi
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'host_platform=%s\n' "$host_platform" >> "$GITHUB_OUTPUT"
          printf 'node_checks=%s\n' "$node_checks" >> "$GITHUB_OUTPUT"
          printf 'program_path=%s\n' "$program_path" >> "$GITHUB_OUTPUT"
          printf 'rust_checks=%s\n' "$rust_checks" >> "$GITHUB_OUTPUT"

  # GitHub Actions owns only a cheap compile/syntax guardrail. Calling the
  # monolithic xtask here used to compile and link the checker/conformance
  # stack before running a second all-target clippy pass. The required local
  # `cargo xtask ci` remains the authority for clippy, tests, generated/static
  # contracts, history, corpus, invariants, evidence, and performance.
  github_guardrail:
    name: github-check
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the guardrail candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Oracle-driver syntax checks use the producer's pinned runtime even
      # though this lane does not execute the oracle or corpus.
      - name: Pin the oracle Node runtime
        if: ${{ needs.classify.outputs.node_checks == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Dependency archives are safe to restore by lockfile. Cargo
      # target directories are deliberately excluded: checkout mtimes
      # make a raw target cache rebuild workspace crates anyway.
      - name: Restore Cargo dependencies
        if: ${{ needs.classify.outputs.rust_checks == 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-
            cargo-v2-${{ runner.os }}-rust-
            cargo-v2-${{ runner.os }}-semantic-

      # Pin both the action commit (v0.0.10) and compiler-cache binary.
      # sccache keys compiler outputs by their actual inputs, so it can
      # reuse workspace crates safely across fresh checkouts.
      - name: Configure compiler cache
        if: ${{ needs.classify.outputs.rust_checks == 'true' }}
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        with:
          version: v0.16.0

      - name: Check Rust formatting
        if: ${{ needs.classify.outputs.rust_checks == 'true' }}
        run: cargo fmt --all -- --check

      # `check` type-checks the workspace's production libraries/binaries
      # without code generation or linking. Test targets belong to local CI.
      - name: Type-check the Rust workspace
        if: ${{ needs.classify.outputs.rust_checks == 'true' }}
        run: cargo check --workspace --locked

      - name: Check oracle driver syntax
        if: ${{ needs.classify.outputs.node_checks == 'true' }}
        run: |
          for driver in crates/oracle/*.mjs; do
            node --check "$driver"
          done

      - name: Record local-only validation scope
        if: ${{ needs.classify.outputs.rust_checks != 'true' && needs.classify.outputs.node_checks != 'true' }}
        run: echo "No Rust/build or oracle-driver inputs changed; the required local full gate owns this slice."

  # Host and path changes receive a small real-filesystem smoke on Windows.
  # This stays independent of the GitHub compile lane and caps Cargo/test parallelism
  # at two workers.
  host_platform:
    name: host-windows-latest
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.host_platform == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout filesystem-host sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run focused filesystem-host contracts
        run: cargo test --manifest-path crates/host/Cargo.toml

      - name: Run focused program filesystem contracts
        if: ${{ needs.classify.outputs.program_path == 'true' }}
        run: >-
          cargo test --manifest-path crates/program/Cargo.toml
          --test path_identity_contract
          --test no_lib_program_loader_contract

  # Preserve the stable process-required check name (and the only context a
  # future branch-protection rule would need). This turns the GitHub compile
  # canary or focused Windows smoke failure into one final result.
  gates:
    name: gates
    if: always()
    needs:
      - classify
      - github_guardrail
      - host_platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          HOST_PLATFORM: ${{ needs.classify.outputs.host_platform }}
          HOST_PLATFORM_RESULT: ${{ needs.host_platform.result }}
          GITHUB_GUARDRAIL_RESULT: ${{ needs.github_guardrail.result }}
          NODE_CHECKS: ${{ needs.classify.outputs.node_checks }}
          PROGRAM_PATH: ${{ needs.classify.outputs.program_path }}
          RUST_CHECKS: ${{ needs.classify.outputs.rust_checks }}
        run: |
          test "$CLASSIFY_RESULT" = success
          for value in "$DOCS_ONLY" "$HOST_PLATFORM" "$NODE_CHECKS" "$PROGRAM_PATH" "$RUST_CHECKS"; do
            case "$value" in
              true|false) ;;
              *) exit 1 ;;
            esac
          done
          if [ "$PROGRAM_PATH" = true ]; then
            test "$HOST_PLATFORM" = true
          fi
          if [ "$DOCS_ONLY" = true ]; then
            test "$HOST_PLATFORM" = false
            test "$NODE_CHECKS" = false
            test "$PROGRAM_PATH" = false
            test "$RUST_CHECKS" = false
            test "$HOST_PLATFORM_RESULT" = skipped
            test "$GITHUB_GUARDRAIL_RESULT" = skipped
          else
            test "$GITHUB_GUARDRAIL_RESULT" = success
            if [ "$HOST_PLATFORM" = true ]; then
              test "$HOST_PLATFORM_RESULT" = success
            else
              test "$HOST_PLATFORM_RESULT" = skipped
            fi
          fi
