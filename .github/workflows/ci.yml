name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit makes an older run irrelevant. Cancelling it frees a
# standard hosted-runner slot immediately and avoids spending public
# repository capacity on stale guardrail work.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep the static hosted guardrail within two compiler workers. The
  # local full gate remains authoritative and uses the same low-CPU profile.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # PR merge-ref caches are isolated from other PRs, but READ_WRITE lets a
  # cancelled or manually rerun guardrail reuse objects from its own scope.
  SCCACHE_GHA_RW_MODE: READ_WRITE

jobs:
  # Keep the required `gates` check available for documentation-only PRs
  # without starting Cargo, Node, B2, or full-corpus work. Workflow-level
  # path filters are not used because a skipped required workflow can remain
  # pending under branch protection.
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      host_platform: ${{ steps.diff.outputs.host_platform }}
      program_path: ${{ steps.diff.outputs.program_path }}
    steps:
      - name: Checkout enough history for PR path classification
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Markdown-only changes
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # A manual dispatch deliberately exercises the non-doc guardrail.
          docs_only=false
          host_platform=true
          program_path=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request \
            && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$BASE_SHA^{commit}" \
            && git cat-file -e "$HEAD_SHA^{commit}"; then
            host_platform=false
            program_path=false
            # Whitespace errors fail even the lightweight documentation path.
            git diff --check "$BASE_SHA" "$HEAD_SHA"

            changed_file="$RUNNER_TEMP/changed-paths"
            # Disable rename collapsing so both the removed and added path are
            # classified; renaming a non-Markdown file to `.md` is not docs-only.
            git diff --name-only --no-renames -z \
              "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
            mapfile -d '' changed < "$changed_file"

            docs_only=true
            if (( ${#changed[@]} == 0 )); then
              docs_only=false
            fi
            for path in "${changed[@]}"; do
              if [[ "$path" != *.md ]]; then
                docs_only=false
              fi
              case "$path" in
                crates/host/*)
                  host_platform=true
                  program_path=true
                  ;;
                crates/program/src/loader.rs|crates/program/src/module_resolution.rs|crates/program/src/path.rs|crates/program/src/prepared.rs)
                  host_platform=true
                  program_path=true
                  ;;
                crates/program/tests/no_lib_program_loader_contract.rs|crates/program/tests/path_identity_contract.rs)
                  host_platform=true
                  program_path=true
                  ;;
                .github/workflows/ci.yml|rust-toolchain.toml)
                  host_platform=true
                  program_path=true
                  ;;
              esac
            done

            # README's generated status is semantic evidence even though the
            # file is Markdown. A changed, missing, or duplicated block must
            # take the non-doc path; the required local full gate owns its
            # readiness-backed readme-status check.
            status_block() {
              git show "$1:README.md" | awk '
                /<!-- STATUS:BEGIN / {
                  if (inside || begins != 0) exit 2
                  inside = 1
                  begins++
                }
                inside { print }
                /<!-- STATUS:END -->/ {
                  if (!inside) exit 2
                  inside = 0
                  ends++
                }
                END {
                  if (inside || begins != 1 || ends != 1) exit 2
                }
              '
            }
            if [[ "$docs_only" == true ]]; then
              if ! base_status="$(status_block "$BASE_SHA")" \
                || ! head_status="$(status_block "$HEAD_SHA")" \
                || [[ "$base_status" != "$head_status" ]]; then
                docs_only=false
              fi
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'host_platform=%s\n' "$host_platform" >> "$GITHUB_OUTPUT"
          printf 'program_path=%s\n' "$program_path" >> "$GITHUB_OUTPUT"

  # GitHub Actions is a static guardrail. Receipt-bound evidence, history
  # audits, full invariants, readiness, and performance gates stay in the
  # required local `cargo xtask ci`; hosted keeps only the bounded lane owned
  # by xtask.
  hosted:
    name: hosted
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the guardrail candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Static Node/schema checks use the producer's pinned runtime even
      # though this lane does not run tests or the corpus.
      - name: Pin the oracle Node runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Dependency archives are safe to restore by lockfile. Cargo
      # target directories are deliberately excluded: checkout mtimes
      # make a raw target cache rebuild workspace crates anyway.
      - name: Restore Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-
            cargo-v2-${{ runner.os }}-rust-
            cargo-v2-${{ runner.os }}-semantic-

      # Pin both the action commit (v0.0.10) and compiler-cache binary.
      # sccache keys compiler outputs by their actual inputs, so it can
      # reuse workspace crates safely across fresh checkouts.
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        with:
          version: v0.16.0

      # Gate composition stays in xtask so the static omissions are explicit.
      # The local full gate owns every history-bound check.
      - name: Run static hosted gates
        run: cargo xtask ci --lane hosted

  # Host and path changes receive a small real-filesystem smoke on Windows.
  # This stays independent of the hosted lane and caps Cargo/test parallelism
  # at two workers.
  host_platform:
    name: host-windows-latest
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.host_platform == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout filesystem-host sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run focused filesystem-host contracts
        run: cargo test --manifest-path crates/host/Cargo.toml

      - name: Run focused program filesystem contracts
        if: ${{ needs.classify.outputs.program_path == 'true' }}
        run: >-
          cargo test --manifest-path crates/program/Cargo.toml
          --test path_identity_contract
          --test no_lib_program_loader_contract

  # Preserve the stable process-required check name (and the only context a
  # future branch-protection rule would need). This turns the static hosted
  # lane or focused Windows smoke failure into one final result.
  gates:
    name: gates
    if: always()
    needs:
      - classify
      - hosted
      - host_platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          HOST_PLATFORM: ${{ needs.classify.outputs.host_platform }}
          HOST_PLATFORM_RESULT: ${{ needs.host_platform.result }}
          HOSTED_RESULT: ${{ needs.hosted.result }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then
            test "$HOST_PLATFORM_RESULT" = skipped
            test "$HOSTED_RESULT" = skipped
          else
            test "$HOSTED_RESULT" = success
            if [ "$HOST_PLATFORM" = true ]; then
              test "$HOST_PLATFORM_RESULT" = success
            else
              test "$HOST_PLATFORM_RESULT" = skipped
            fi
          fi
