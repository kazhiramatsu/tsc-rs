name: ci

on:
  pull_request:
  # Default-branch runs populate caches that pull requests are allowed
  # to restore. Caches produced on a PR's merge ref are intentionally
  # isolated by GitHub and cannot warm the next PR.
  push:
    branches:
      - main

permissions:
  contents: read

# A newer commit makes an older run irrelevant. Cancelling it frees a
# standard hosted-runner slot immediately and avoids spending public
# repository capacity on stale evidence.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep hosted validation within two compiler/test workers. The local full
  # gate remains authoritative and may choose the same low-CPU profile.
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "2"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  TSRS_INVARIANT_WORKERS: "2"
  # PR merge-ref entries cannot warm main or another PR. Read the shared
  # default-branch cache there, and publish new compiler objects only on main.
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}

jobs:
  # Keep the required `gates` check available for documentation-only PRs
  # without starting Cargo, Node, B2, or full-corpus work. Workflow-level
  # path filters are not used because a skipped required workflow can remain
  # pending under branch protection.
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      history_sensitive: ${{ steps.diff.outputs.history_sensitive }}
      host_platform: ${{ steps.diff.outputs.host_platform }}
      program_path: ${{ steps.diff.outputs.program_path }}
      baseline_sha: ${{ steps.diff.outputs.baseline_sha }}
    steps:
      - name: Checkout enough history to classify the complete change
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Markdown-only changes
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          docs_only=false
          # An unprovable diff takes the safe platform path. Ordinary PR and
          # main-push diffs reset these before classifying exact paths below.
          history_sensitive=true
          host_platform=true
          program_path=true
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$BASE_SHA^{commit}" \
            && git cat-file -e "$HEAD_SHA^{commit}"; then
            host_platform=false
            program_path=false
            history_sensitive=false
            # Whitespace errors fail even the lightweight documentation path.
            git diff --check "$BASE_SHA" "$HEAD_SHA"

            changed_file="$RUNNER_TEMP/changed-paths"
            # Disable rename collapsing so both the removed and added path are
            # classified; renaming a non-Markdown file to `.md` is not docs-only.
            git diff --name-only --no-renames -z \
              "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
            mapfile -d '' changed < "$changed_file"

            docs_only=true
            if (( ${#changed[@]} == 0 )); then
              docs_only=false
            fi
            for path in "${changed[@]}"; do
              if [[ "$path" != *.md ]]; then
                docs_only=false
              fi
              case "$path" in
                crates/host/*)
                  host_platform=true
                  program_path=true
                  ;;
                crates/program/src/loader.rs|crates/program/src/module_resolution.rs|crates/program/src/path.rs|crates/program/src/prepared.rs)
                  host_platform=true
                  program_path=true
                  ;;
                crates/program/tests/no_lib_program_loader_contract.rs|crates/program/tests/path_identity_contract.rs)
                  host_platform=true
                  program_path=true
                  ;;
                .github/workflows/ci.yml|rust-toolchain.toml)
                  host_platform=true
                  program_path=true
                  ;;
              esac
              # These paths own accepted-state identity, history auditors, or
              # frozen H0/M8 boundaries. Only those changes pay for the
              # trusted-base history audit; broad ordinary source changes rely
              # on the required local full gate plus hosted conformance.
              case "$path" in
                ratchet.toml|ratchets/*|m8-scope.json|diag-families.json|m8-emitter-inventory.json|m8-emitter-dispositions.json|m8-owner-plan.json|m8-owner-plan-review.json|goldens/*|ts-tests/tests/cases/*|vendor/typescript-6.0.3/*|crates/conformance/*|crates/harness/*|crates/oracle/*|crates/xtask/*|crates/checker/*|crates/compiler/*|crates/program/*|crates/host/*|.node-version|.cargo/*|.github/workflows/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|crates/*/Cargo.toml)
                  history_sensitive=true
                  ;;
              esac
            done

            # README's generated status is semantic evidence even though the
            # file is Markdown. A changed, missing, or duplicated block must
            # take the non-doc path; the required local full gate owns its
            # readiness-backed readme-status check.
            status_block() {
              git show "$1:README.md" | awk '
                /<!-- STATUS:BEGIN / {
                  if (inside || begins != 0) exit 2
                  inside = 1
                  begins++
                }
                inside { print }
                /<!-- STATUS:END -->/ {
                  if (!inside) exit 2
                  inside = 0
                  ends++
                }
                END {
                  if (inside || begins != 1 || ends != 1) exit 2
                }
              '
            }
            if [[ "$docs_only" == true ]]; then
              if ! base_status="$(status_block "$BASE_SHA")" \
                || ! head_status="$(status_block "$HEAD_SHA")" \
                || [[ "$base_status" != "$head_status" ]]; then
                docs_only=false
              fi
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'history_sensitive=%s\n' "$history_sensitive" >> "$GITHUB_OUTPUT"
          printf 'host_platform=%s\n' "$host_platform" >> "$GITHUB_OUTPUT"
          printf 'program_path=%s\n' "$program_path" >> "$GITHUB_OUTPUT"
          printf 'baseline_sha=%s\n' "$BASE_SHA" >> "$GITHUB_OUTPUT"

  # GitHub Actions is a bounded guardrail. Receipt-bound B2-B4 evidence, full
  # invariants, readiness, and performance gates stay in the required local
  # `cargo xtask ci`; hosted keeps compile/tests, fixed-view conformance,
  # sampled invariants, cheap contracts, and authority-sensitive history.
  hosted:
    name: hosted
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The Rust workspace tests validate committed scope/registry lineage.
      # A depth-1 merge checkout cannot reach their frozen bootstrap commits.
      - name: Checkout full lineage for history-backed tests
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Oracle driver tests must use the producer's pinned Node
      # runtime, even though this lane does not run the full corpus.
      - name: Pin the oracle Node runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Dependency archives are safe to restore by lockfile. Cargo
      # target directories are deliberately excluded: checkout mtimes
      # make a raw target cache rebuild workspace crates anyway.
      - name: Restore Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-
            cargo-v2-${{ runner.os }}-rust-
            cargo-v2-${{ runner.os }}-semantic-

      # Pin both the action commit (v0.0.10) and compiler-cache binary.
      # sccache keys compiler outputs by their actual inputs, so it can
      # reuse workspace crates safely across fresh checkouts.
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        with:
          version: v0.16.0

      # Gate composition stays in xtask so the omissions are explicit and
      # unit-tested. Evidence production, full invariants, readiness, and
      # calibrated performance observations run only in the local full gate.
      - name: Run bounded hosted gates
        env:
          BASELINE_SHA: ${{ needs.classify.outputs.baseline_sha }}
          HISTORY_SENSITIVE: ${{ needs.classify.outputs.history_sensitive }}
        shell: bash
        run: |
          args=(--lane hosted --baseline "$BASELINE_SHA")
          if [[ "$HISTORY_SENSITIVE" == true ]]; then
            args+=(--history-sensitive)
          fi
          cargo xtask ci "${args[@]}"

  # Host and path changes receive a small real-filesystem smoke on both
  # supported desktop platform families. This stays independent of the
  # hosted lane and caps Cargo/test parallelism at two workers.
  host_platform:
    name: host-${{ matrix.os }}
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.host_platform == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout filesystem-host sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run focused filesystem-host contracts
        run: cargo test --manifest-path crates/host/Cargo.toml

      - name: Run focused program filesystem contracts
        if: ${{ needs.classify.outputs.program_path == 'true' }}
        run: >-
          cargo test --manifest-path crates/program/Cargo.toml
          --test path_identity_contract
          --test no_lib_program_loader_contract

  # Preserve the stable process-required check name (and the only context a
  # future branch-protection rule would need). This turns the bounded hosted
  # lane or focused cross-platform smoke failure into one final result.
  gates:
    name: gates
    if: always()
    needs:
      - classify
      - hosted
      - host_platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          HOST_PLATFORM: ${{ needs.classify.outputs.host_platform }}
          HOST_PLATFORM_RESULT: ${{ needs.host_platform.result }}
          HOSTED_RESULT: ${{ needs.hosted.result }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then
            test "$HOST_PLATFORM_RESULT" = skipped
            test "$HOSTED_RESULT" = skipped
          else
            test "$HOSTED_RESULT" = success
            if [ "$HOST_PLATFORM" = true ]; then
              test "$HOST_PLATFORM_RESULT" = success
            else
              test "$HOST_PLATFORM_RESULT" = skipped
            fi
          fi
