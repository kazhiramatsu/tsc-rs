name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit makes an older run irrelevant. Cancelling it frees a
# standard hosted-runner slot immediately and avoids spending public
# repository capacity on stale platform-smoke work.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the required `gates` check available for documentation-only PRs
  # without starting Cargo, Node, B2, or full-corpus work. Workflow-level
  # path filters are not used because a skipped required workflow can remain
  # pending under branch protection.
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      host_platform: ${{ steps.diff.outputs.host_platform }}
      program_path: ${{ steps.diff.outputs.program_path }}
    steps:
      - name: Checkout enough history for PR path classification
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect validation scope
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # A manual dispatch deliberately exercises the non-doc classifier
          # and platform-smoke path.
          docs_only=false
          host_platform=true
          program_path=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request \
            && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$BASE_SHA^{commit}" \
            && git cat-file -e "$HEAD_SHA^{commit}"; then
            host_platform=false
            program_path=false

            changed_file="$RUNNER_TEMP/changed-paths"
            # Disable rename collapsing so both the removed and added path are
            # classified; renaming a non-Markdown file to `.md` is not docs-only.
            git diff --name-only --no-renames -z \
              "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
            mapfile -d '' changed < "$changed_file"

            docs_only=true
            if (( ${#changed[@]} == 0 )); then
              docs_only=false
            fi
            for path in "${changed[@]}"; do
              if [[ "$path" != *.md ]]; then
                docs_only=false
                case "$path" in
                  crates/host/*|crates/program/*|rust-toolchain.toml)
                    host_platform=true
                    if [[ "$path" == crates/program/* ]]; then
                      program_path=true
                    fi
                    ;;
                esac
              fi
            done

            # README's generated status is semantic evidence even though the
            # file is Markdown. A changed, missing, or duplicated block must
            # take the non-doc path; the required local full gate owns its
            # readiness-backed readme-status check.
            status_block() {
              git show "$1:README.md" | awk '
                /<!-- STATUS:BEGIN / {
                  if (inside || begins != 0) exit 2
                  inside = 1
                  begins++
                }
                inside { print }
                /<!-- STATUS:END -->/ {
                  if (!inside) exit 2
                  inside = 0
                  ends++
                }
                END {
                  if (inside || begins != 1 || ends != 1) exit 2
                }
              '
            }
            if [[ "$docs_only" == true ]]; then
              if ! base_status="$(status_block "$BASE_SHA")" \
                || ! head_status="$(status_block "$HEAD_SHA")" \
                || [[ "$base_status" != "$head_status" ]]; then
                docs_only=false
              fi
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'host_platform=%s\n' "$host_platform" >> "$GITHUB_OUTPUT"
          printf 'program_path=%s\n' "$program_path" >> "$GITHUB_OUTPUT"

  # Host and path changes receive the only hosted execution lane: a small
  # real-filesystem smoke on Windows. All ordinary Rust, Node, semantic, and
  # corpus validation is intentionally local-only.
  host_platform:
    name: host-windows-latest
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.host_platform == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "2"
      # The runner is clean and no target directory is restored. Avoid
      # producing incremental state or test debuginfo that this smoke never
      # consumes; this reduces compile/link I/O without adding CPU workers.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout filesystem-host sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run focused filesystem-host contracts
        run: >-
          cargo test --manifest-path crates/host/Cargo.toml
          --test filesystem_host_contract

      - name: Run focused program filesystem contracts
        if: ${{ needs.classify.outputs.program_path == 'true' }}
        run: >-
          cargo test --manifest-path crates/program/Cargo.toml
          --test host_platform_smoke_contract

  # Preserve the stable process-required check name (and the only context a
  # future branch-protection rule would need). This turns the classifier or
  # focused Windows smoke failure into one final result.
  gates:
    name: gates
    if: always()
    needs:
      - classify
      - host_platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          HOST_PLATFORM: ${{ needs.classify.outputs.host_platform }}
          HOST_PLATFORM_RESULT: ${{ needs.host_platform.result }}
          PROGRAM_PATH: ${{ needs.classify.outputs.program_path }}
        run: |
          test "$CLASSIFY_RESULT" = success
          for value in "$DOCS_ONLY" "$HOST_PLATFORM" "$PROGRAM_PATH"; do
            case "$value" in
              true|false) ;;
              *) exit 1 ;;
            esac
          done
          if [ "$PROGRAM_PATH" = true ]; then
            test "$HOST_PLATFORM" = true
          fi
          if [ "$DOCS_ONLY" = true ]; then
            test "$HOST_PLATFORM" = false
            test "$PROGRAM_PATH" = false
            test "$HOST_PLATFORM_RESULT" = skipped
          else
            if [ "$HOST_PLATFORM" = true ]; then
              test "$HOST_PLATFORM_RESULT" = success
            else
              test "$HOST_PLATFORM_RESULT" = skipped
            fi
          fi
