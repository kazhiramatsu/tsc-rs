name: ci

on:
  pull_request:
  # Default-branch runs populate caches that pull requests are allowed
  # to restore. Caches produced on a PR's merge ref are intentionally
  # isolated by GitHub and cannot warm the next PR.
  push:
    branches:
      - main

permissions:
  contents: read

# A newer commit makes an older run irrelevant. Cancelling it frees a
# standard hosted-runner slot immediately and avoids spending public
# repository capacity on stale evidence.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # PR merge-ref entries cannot warm main or another PR. Read the shared
  # default-branch cache there, and publish new compiler objects only on main.
  SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}

jobs:
  # Keep the required `gates` check available for documentation-only PRs
  # without starting Cargo, Node, B2, or full-corpus work. Workflow-level
  # path filters are not used because a skipped required workflow can remain
  # pending under branch protection.
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - name: Checkout enough history to classify the complete change
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Markdown-only changes
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          docs_only=false
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$BASE_SHA^{commit}" \
            && git cat-file -e "$HEAD_SHA^{commit}"; then
            # Whitespace errors fail even the lightweight documentation path.
            git diff --check "$BASE_SHA" "$HEAD_SHA"

            changed_file="$RUNNER_TEMP/changed-paths"
            # Disable rename collapsing so both the removed and added path are
            # classified; renaming a non-Markdown file to `.md` is not docs-only.
            git diff --name-only --no-renames -z \
              "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
            mapfile -d '' changed < "$changed_file"

            docs_only=true
            if (( ${#changed[@]} == 0 )); then
              docs_only=false
            fi
            for path in "${changed[@]}"; do
              if [[ "$path" != *.md ]]; then
                docs_only=false
                break
              fi
            done

            # README's generated status is semantic evidence even though the
            # file is Markdown. A changed, missing, or duplicated block must
            # run readme-status through the full semantic lane.
            status_block() {
              git show "$1:README.md" | awk '
                /<!-- STATUS:BEGIN / {
                  if (inside || begins != 0) exit 2
                  inside = 1
                  begins++
                }
                inside { print }
                /<!-- STATUS:END -->/ {
                  if (!inside) exit 2
                  inside = 0
                  ends++
                }
                END {
                  if (inside || begins != 1 || ends != 1) exit 2
                }
              '
            }
            if [[ "$docs_only" == true ]]; then
              if ! base_status="$(status_block "$BASE_SHA")" \
                || ! head_status="$(status_block "$HEAD_SHA")" \
                || [[ "$base_status" != "$head_status" ]]; then
                docs_only=false
              fi
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

  rust:
    name: rust
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The Rust workspace tests validate committed scope/registry lineage.
      # A depth-1 merge checkout cannot reach their frozen bootstrap commits.
      - name: Checkout full lineage for history-backed tests
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Oracle driver tests must use the producer's pinned Node
      # runtime, even though this lane does not run the full corpus.
      - name: Pin the oracle Node runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Dependency archives are safe to restore by lockfile. Cargo
      # target directories are deliberately excluded: checkout mtimes
      # make a raw target cache rebuild workspace crates anyway.
      - name: Restore Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-v2-${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-rust-

      # Pin both the action commit (v0.0.10) and compiler-cache binary.
      # sccache keys compiler outputs by their actual inputs, so it can
      # reuse workspace crates safely across fresh checkouts.
      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        with:
          version: v0.16.0

      # Gate composition stays in xtask so local and hosted execution
      # cannot drift. The lane boundary only lets the two independent
      # halves run on separate standard hosted runners.
      - name: Run Rust gates
        run: cargo xtask ci --lane rust

  semantic:
    name: semantic
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    # The cold B2 evidence build plus every full-corpus invariant made this
    # job reach the 30-minute limit on the standard hosted runner at M8 close.
    # Keep enough headroom for cold-cache variance without changing the
    # single-worker evidence policy.
    timeout-minutes: 45
    steps:
      - name: Checkout full lineage
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every full-corpus oracle launch must use the producer's pinned
      # Node version; the runner image's default would skew evidence.
      - name: Pin the oracle Node runtime
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Restore Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-v2-${{ runner.os }}-semantic-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-semantic-

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        with:
          version: v0.16.0

      # B2 is a full 7,462-program oracle sweep. Compute its narrow
      # producer-input fingerprint first, then restore only the raw
      # runtime artifact for that exact content. produce_all revalidates
      # its schema, fingerprint, inventory hash, counts, and zero-hit
      # reviews before reuse; a miss or invalid entry regenerates it.
      - name: Compute B2 runtime evidence fingerprint
        id: m8-b2-fingerprint
        run: |
          fingerprint="$(cargo xtask m8 evidence fingerprint --kind runtime)"
          printf 'sha256=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore exact B2 runtime evidence
        uses: actions/cache@v5
        with:
          path: target/m8/evidence/runtime-coverage.json
          key: m8-b2-v2-${{ runner.os }}-${{ steps.m8-b2-fingerprint.outputs.sha256 }}

      # Full-corpus passes once peaked at ~11.5 GB RSS. The underlying
      # multiplication bug is fixed (~1.7 GB now), but the headroom
      # remains a cheap guard against runner-agent OOM termination.
      - name: Provision memory headroom for full-corpus passes
        run: |
          sudo systemctl stop systemd-oomd.service systemd-oomd.socket || true
          sudo fallocate -l 8G /swap-semantic
          sudo chmod 600 /swap-semantic
          sudo mkswap /swap-semantic
          sudo swapon /swap-semantic
          free -h
          df -h /

      # A1/A2/A5 checks, conformance's three views, recovery census,
      # readiness production/consumption, ledger, and escapes remain
      # in one workspace. Only the independent Rust compiler/test
      # gates run on the parallel runner.
      - name: Run semantic gates against trusted baseline
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The full-corpus jobs-independence schedules use a bounded ordered
          # pipeline. Two workers fit the standard runner without turning the
          # memory-heavy checker sweep into an all-core burst.
          TSRS_INVARIANT_WORKERS: "2"
          TSRS_M8_RUNNER_PROFILE: github-ubuntu-x64-standard
        run: cargo xtask ci --lane semantic --baseline "$BASELINE_SHA"

      - name: Upload semantic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-gate-artifacts
          if-no-files-found: ignore
          path: |
            target/conformance/mismatches.json
            target/families/report.json
            target/m8/
            target/recovery-census.json

  # Preserve the historical required-check name. Branch protection
  # needs only `gates`; this job turns either parallel lane's failure,
  # cancellation, or timeout into one deterministic final result.
  gates:
    name: gates
    if: always()
    needs:
      - classify
      - rust
      - semantic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          RUST_RESULT: ${{ needs.rust.result }}
          SEMANTIC_RESULT: ${{ needs.semantic.result }}
        run: |
          if [ "$DOCS_ONLY" = true ]; then
            test "$RUST_RESULT" = skipped
            test "$SEMANTIC_RESULT" = skipped
          else
            test "$RUST_RESULT" = success
            test "$SEMANTIC_RESULT" = success
          fi
