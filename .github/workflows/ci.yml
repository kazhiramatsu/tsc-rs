name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Produce one schema-validated, content-bound selection. Documentation-only
  # changes preserve the stable aggregate check without starting Rust/Node
  # execution. Missing history, unknown paths, generated README-status drift,
  # and renamed non-Markdown sources all select the broad guardrail.
  classify:
    name: classify
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.diff.outputs.head_sha }}
      base_sha: ${{ steps.diff.outputs.base_sha }}
      docs_only: ${{ steps.diff.outputs.docs_only }}
      static: ${{ steps.diff.outputs.static }}
      host_platform: ${{ steps.diff.outputs.host_platform }}
      program_path: ${{ steps.diff.outputs.program_path }}
      l0_l1: ${{ steps.diff.outputs.l0_l1 }}
      h1: ${{ steps.diff.outputs.h1 }}
      selection_sha256: ${{ steps.diff.outputs.selection_sha256 }}
    steps:
      - name: Checkout exact classification history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CI contracts and classify changed owners
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          node --test .github/ci/qualification.test.mjs
          node .github/ci/qualification.mjs check
          base_sha="$EVENT_BASE_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          node .github/ci/qualification.mjs classify \
            --base "$base_sha" \
            --head "$EVENT_HEAD_SHA" \
            --out "$RUNNER_TEMP/lane-selection.json" \
            --github-output "$GITHUB_OUTPUT"

  # Required bounded PR feedback for every non-documentation change. This is
  # deliberately not the semantic merge authority: exact acceptance remains
  # the unsplit full gate bound by the merge-receipt contract.
  static:
    name: static-and-focused
    needs: classify
    if: ${{ needs.classify.outputs.static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check every locked workspace target without linking
        run: cargo check --workspace --all-targets --locked

      - name: Run common qualification contract tests
        run: |
          node --test .github/ci/qualification.test.mjs
          node .github/ci/qualification.mjs check

      - name: Run L0/L1 focused controls
        if: ${{ needs.classify.outputs.l0_l1 == 'true' }}
        run: |
          node --check crates/oracle/l0-fixtures.mjs
          node crates/oracle/l0-fixtures.mjs --check
          node crates/oracle/l0-fixtures.mjs --smoke
          node --check crates/oracle/l0-option-inventory.mjs
          node crates/oracle/l0-option-inventory.mjs --check
          node --check crates/oracle/l0-performance.mjs
          node crates/oracle/l0-performance.mjs --check
          cargo xtask codegen nodes-check
          cargo test --locked \
            --manifest-path crates/types/Cargo.toml \
            --lib \
            identity::tests
          cargo test --locked \
            --manifest-path crates/syntax/Cargo.toml \
            --lib \
            generated_relocation_matches_a_direct_forced_nonzero_parse
          cargo test --locked \
            --manifest-path crates/binder/Cargo.toml \
            --lib \
            bind_relocation_matches_direct_nonzero_symbols_and_private_serials
          cargo test --locked \
            --manifest-path crates/checker/Cargo.toml \
            --lib \
            program::tests
          cargo xtask l0 identity-stress \
            --seed 0x1d3a71a5e5ca5e02 \
            --iterations 256 \
            --max-active 16 \
            --max-rss-bytes 268435456 \
            --report target/l0/identity-stress-pr.json
          cargo test --locked \
            --manifest-path crates/diagnostics/Cargo.toml \
            --lib \
            text::tests
          cargo test --locked \
            --manifest-path crates/syntax/Cargo.toml \
            --lib \
            snapshot_entry_preserves_text_and_position_owner_identity
          cargo test --locked \
            --manifest-path crates/checker/Cargo.toml \
            --lib \
            checker_input_and_source_file_share_the_exact_snapshot_arc
          cargo test --locked \
            --manifest-path crates/compiler/Cargo.toml \
            --lib \
            prepared_to_checker_projection_preserves_the_exact_snapshot_arc
          cargo test --locked \
            --manifest-path crates/compiler/Cargo.toml \
            --test contracts \
            l0_work_counters

      - name: Run H1 zero-cost H0 control
        if: ${{ needs.classify.outputs.h1 == 'true' }}
        run: >-
          cargo test --locked
          --manifest-path crates/compiler/Cargo.toml
          --test contracts
          frozen_h0_profile_matches_the_executable_boundaries

  # Platform-sensitive host/program changes retain focused Windows evidence.
  host_platform:
    name: host-windows-latest
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.host_platform == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout filesystem-host sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run focused filesystem-host contracts
        run: >-
          cargo test --locked
          --manifest-path crates/host/Cargo.toml
          --test filesystem_host_contract

      - name: Run focused program filesystem contracts
        if: ${{ needs.classify.outputs.program_path == 'true' }}
        run: >-
          cargo test --locked
          --manifest-path crates/program/Cargo.toml
          --test host_platform_smoke_contract

  # The semantic merge authority. The complete unsplit gate is executed at
  # the exact classified HEAD/base, then its strict result is signed through
  # GitHub's OIDC-backed artifact-attestation service. The job succeeds only
  # after an independent gh verifier checks the signer workflow and the final
  # receipt rebinds that verified bundle to the same result and commits.
  exact_qualification:
    name: exact-merge-qualification
    needs: classify
    if: >-
      ${{
        needs.classify.outputs.static == 'true' &&
        (needs.classify.outputs.l0_l1 == 'true' || needs.classify.outputs.h1 == 'true') &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: ""
      TSRS_M8_RUNNER_PROFILE: github-ubuntu-x64-standard
      EXACT_HEAD: ${{ needs.classify.outputs.head_sha }}
      EXACT_BASE: ${{ needs.classify.outputs.base_sha }}
      EXPECTED_SELECTION_SHA256: ${{ needs.classify.outputs.selection_sha256 }}
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.classify.outputs.head_sha }}

      - name: Install the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Verify the pinned Node runtime
        shell: bash
        run: |
          expected="$(tr -d '[:space:]' <.node-version)"
          actual="$(node --version)"
          test "${actual#v}" = "${expected#v}"

      - name: Reproduce the exact lane selection
        shell: bash
        run: |
          node .github/ci/qualification.mjs classify \
            --base "$EXACT_BASE" \
            --head "$EXACT_HEAD" \
            --out "$RUNNER_TEMP/lane-selection.json" \
            --github-output "$RUNNER_TEMP/reclassified.outputs"
          actual="$(sed -n 's/^selection_sha256=//p' "$RUNNER_TEMP/reclassified.outputs")"
          test "$actual" = "$EXPECTED_SELECTION_SHA256"

      - name: Run the unsplit full gate at the exact base
        id: full_gate
        shell: bash
        run: |
          set +e
          cargo xtask ci --baseline "$EXACT_BASE" \
            >"$RUNNER_TEMP/full-gate.stdout" \
            2>"$RUNNER_TEMP/full-gate.stderr"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            {
              printf 'stdout:\n'
              cat "$RUNNER_TEMP/full-gate.stdout"
              printf '\nstderr:\n'
              cat "$RUNNER_TEMP/full-gate.stderr"
            } >"$RUNNER_TEMP/full-gate.failure.log"
            exit "$code"
          fi

      - name: Produce the strict attestation subject
        run: |
          node .github/ci/qualification.mjs produce-result \
            --base "$EXACT_BASE" \
            --head "$EXACT_HEAD" \
            --selection "$RUNNER_TEMP/lane-selection.json" \
            --stdout "$RUNNER_TEMP/full-gate.stdout" \
            --stderr "$RUNNER_TEMP/full-gate.stderr" \
            --out "$RUNNER_TEMP/qualification-result.json"

      - name: Sign the exact qualification result with GitHub OIDC
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/qualification-result.json

      - name: Verify OIDC provenance and finalize the receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          gh attestation verify "$RUNNER_TEMP/qualification-result.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$ATTESTATION_BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com"
          node .github/ci/qualification.mjs finalize-receipt \
            --result "$RUNNER_TEMP/qualification-result.json" \
            --bundle "$ATTESTATION_BUNDLE" \
            --issuer "https://token.actions.githubusercontent.com" \
            --subject "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --out "$RUNNER_TEMP/merge-receipt.json"
          node .github/ci/qualification.mjs verify-bound-receipt \
            --receipt "$RUNNER_TEMP/merge-receipt.json" \
            --result "$RUNNER_TEMP/qualification-result.json" \
            --bundle "$ATTESTATION_BUNDLE" \
            --head "$EXACT_HEAD" \
            --base "$EXACT_BASE"

      - name: Publish authenticated receipt evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-qualification-${{ needs.classify.outputs.head_sha }}
          path: |
            ${{ runner.temp }}/qualification-result.json
            ${{ runner.temp }}/merge-receipt.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Produce bounded full-gate failure evidence
        if: ${{ failure() && steps.full_gate.outcome == 'failure' }}
        run: |
          node .github/ci/qualification.mjs write-failure \
            --head "$EXACT_HEAD" \
            --base "$EXACT_BASE" \
            --track l0-l1 \
            --source "$RUNNER_TEMP/full-gate.failure.log" \
            --payload-path target/ci-failure/full-gate.log \
            --content-type text/plain \
            --out target/ci-failure/full-gate.json
          node .github/ci/qualification.mjs verify-failure \
            --path target/ci-failure/full-gate.json \
            --payload target/ci-failure/full-gate.log

      - name: Upload bounded full-gate failure evidence
        if: ${{ failure() && steps.full_gate.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-qualification-failure-${{ needs.classify.outputs.head_sha }}
          path: target/ci-failure/
          if-no-files-found: error
          retention-days: 14

  # L0.1 activates deterministic randomized byte/UTF-16 edits, bounded
  # snapshot history, and bounded RSS over the frozen large-edit input.
  # L0.2 owns identity/open-close churn. Later slices extend this authority
  # with registry reclamation, Program churn, incremental exactness, and
  # cancellation observations.
  scheduled_stress:
    name: scheduled-l0-stress
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify and materialize frozen edit fixtures
        run: |
          node --check crates/oracle/l0-fixtures.mjs
          node crates/oracle/l0-fixtures.mjs --check
          node crates/oracle/l0-fixtures.mjs --materialize "$RUNNER_TEMP/l0-fixtures"

      - name: Run deterministic long text-store stress with an RSS bound
        id: text_stress
        run: >-
          cargo xtask l0 text-stress
          --fixture "$RUNNER_TEMP/l0-fixtures/large-edit/large-edit.ts"
          --seed 0x5eed1a01cafef00d
          --edits 20000
          --max-rss-bytes 536870912
          --report target/l0/text-stress.json

      - name: Run deterministic identity open/edit/close churn
        id: identity_stress
        run: >-
          cargo xtask l0 identity-stress
          --seed 0x1d3a71a5e5ca5e02
          --iterations 10000
          --max-active 64
          --max-rss-bytes 536870912
          --report target/l0/identity-stress.json

      - name: Produce bounded stress failure evidence
        if: ${{ failure() && steps.text_stress.outcome == 'failure' }}
        shell: bash
        env:
          EXACT_HEAD: ${{ github.sha }}
        run: |
          base="$(git rev-parse HEAD^)"
          initial_hash="$(node -e 'const fs=require("fs"),crypto=require("crypto");process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$RUNNER_TEMP/l0-fixtures/large-edit/large-edit.ts")"
          if [ ! -f target/l0/text-stress.json ]; then
            mkdir -p target/l0
            printf '{"error":"text-stress command failed before publishing its report"}\n' >target/l0/text-stress.json
          fi
          node .github/ci/qualification.mjs write-failure \
            --head "$EXACT_HEAD" \
            --base "$base" \
            --track stress \
            --source target/l0/text-stress.json \
            --payload-path target/ci-failure/text-stress.json \
            --content-type application/json \
            --seed 0x5eed1a01cafef00d \
            --fixture ratchets/l0-fixtures.v1.json \
            --initial-text-sha256 "$initial_hash" \
            --out target/ci-failure/text-stress-manifest.json
          node .github/ci/qualification.mjs verify-failure \
            --path target/ci-failure/text-stress-manifest.json \
            --payload target/ci-failure/text-stress.json

      - name: Produce bounded identity-stress failure evidence
        if: ${{ failure() && steps.identity_stress.outcome == 'failure' }}
        shell: bash
        env:
          EXACT_HEAD: ${{ github.sha }}
        run: |
          base="$(git rev-parse HEAD^)"
          if [ ! -f target/l0/identity-stress.json ]; then
            mkdir -p target/l0
            printf '{"error":"identity-stress command failed before publishing its report"}\n' >target/l0/identity-stress.json
          fi
          node .github/ci/qualification.mjs write-failure \
            --head "$EXACT_HEAD" \
            --base "$base" \
            --track stress \
            --source target/l0/identity-stress.json \
            --payload-path target/ci-failure/identity-stress.json \
            --content-type application/json \
            --seed 0x1d3a71a5e5ca5e02 \
            --out target/ci-failure/identity-stress-manifest.json
          node .github/ci/qualification.mjs verify-failure \
            --path target/ci-failure/identity-stress-manifest.json \
            --payload target/ci-failure/identity-stress.json

      - name: Upload bounded stress failure evidence
        if: ${{ failure() && (steps.text_stress.outcome == 'failure' || steps.identity_stress.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scheduled-l0-stress-failure-${{ github.sha }}
          path: target/ci-failure/
          if-no-files-found: error
          retention-days: 14

  # One stable branch-protection context. Selected jobs must finish in a
  # known state; an absent, unknown, or unexpectedly skipped lane fails.
  gates:
    name: gates
    if: ${{ always() && github.event_name != 'schedule' }}
    needs:
      - classify
      - static
      - host_platform
      - exact_qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          STATIC: ${{ needs.classify.outputs.static }}
          STATIC_RESULT: ${{ needs.static.result }}
          HOST_PLATFORM: ${{ needs.classify.outputs.host_platform }}
          HOST_PLATFORM_RESULT: ${{ needs.host_platform.result }}
          PROGRAM_PATH: ${{ needs.classify.outputs.program_path }}
          L0_L1: ${{ needs.classify.outputs.l0_l1 }}
          H1: ${{ needs.classify.outputs.h1 }}
          EXACT_QUALIFICATION_RESULT: ${{ needs.exact_qualification.result }}
          SELECTION_SHA256: ${{ needs.classify.outputs.selection_sha256 }}
        run: |
          test "$CLASSIFY_RESULT" = success
          test "${#SELECTION_SHA256}" = 64
          for value in "$DOCS_ONLY" "$STATIC" "$HOST_PLATFORM" "$PROGRAM_PATH" "$L0_L1" "$H1"; do
            case "$value" in
              true|false) ;;
              *) exit 1 ;;
            esac
          done
          if [ "$PROGRAM_PATH" = true ]; then
            test "$HOST_PLATFORM" = true
          fi
          if [ "$DOCS_ONLY" = true ]; then
            test "$STATIC" = false
            test "$HOST_PLATFORM" = false
            test "$PROGRAM_PATH" = false
            test "$L0_L1" = false
            test "$H1" = false
            test "$STATIC_RESULT" = skipped
            test "$HOST_PLATFORM_RESULT" = skipped
          else
            test "$STATIC" = true
            test "$STATIC_RESULT" = success
            if [ "$HOST_PLATFORM" = true ]; then
              test "$HOST_PLATFORM_RESULT" = success
            else
              test "$HOST_PLATFORM_RESULT" = skipped
            fi
            if [ "$L0_L1" = true ] || [ "$H1" = true ]; then
              test "$EXACT_QUALIFICATION_RESULT" = success
            else
              test "$EXACT_QUALIFICATION_RESULT" = skipped
            fi
          fi
