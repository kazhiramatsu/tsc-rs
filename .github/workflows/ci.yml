name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub Actions owns one acceptance signal only. Local CI uses the same
  # `cargo xtask acceptance` entrypoint; use focused owner checks while editing.
  # Historical evidence regeneration is separate from routine local CI.
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: ""
      # H2.5g is the sole hosted-wide fan-out. The Rust pipeline restores
      # qualification order; local runs remain serial unless explicitly set.
      TSRS_H2_5G_WORKERS: "2"
      # Hosted acceptance keeps the conformance checker pool at the same
      # conservative bound as the emit workers; the dev profile ceiling in
      # m8-evidence.json applies locally.
      TSRS_CONFORMANCE_WORKERS: "2"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run ts-tests acceptance suite
        run: cargo xtask acceptance
