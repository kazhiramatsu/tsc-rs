name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_acceptance: ${{ steps.plan.outputs.has_acceptance }}
      matrix: ${{ steps.plan.outputs.acceptance_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        name: Select affected replay groups
        run: python3 .github/ci/replay.py plan

  acceptance:
    name: acceptance (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.has_acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: ""
      TSRS_H2_5G_WORKERS: "2"
      TSRS_CONFORMANCE_WORKERS: "2"
      ACCEPTANCE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run selected acceptance
        run: python3 .github/ci/replay.py acceptance "$ACCEPTANCE_GROUP"

  gates:
    name: gates
    needs: [plan, acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPLAY_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every selected group to succeed
        run: python3 .github/ci/replay.py gate acceptance
