name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Produce one schema-validated, content-bound selection. Documentation-only
  # changes preserve the stable aggregate check without starting Rust/Node
  # execution. Missing history, unknown paths, generated README-status drift,
  # and renamed non-Markdown sources all select the broad guardrail.
  classify:
    name: classify
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      static: ${{ steps.diff.outputs.static }}
      host_platform: ${{ steps.diff.outputs.host_platform }}
      program_path: ${{ steps.diff.outputs.program_path }}
      l0_l1: ${{ steps.diff.outputs.l0_l1 }}
      h1: ${{ steps.diff.outputs.h1 }}
      selection_sha256: ${{ steps.diff.outputs.selection_sha256 }}
    steps:
      - name: Checkout exact classification history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CI contracts and classify changed owners
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          node --test .github/ci/qualification.test.mjs
          node .github/ci/qualification.mjs check
          base_sha="$EVENT_BASE_SHA"
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          node .github/ci/qualification.mjs classify \
            --base "$base_sha" \
            --head "$EVENT_HEAD_SHA" \
            --out "$RUNNER_TEMP/lane-selection.json" \
            --github-output "$GITHUB_OUTPUT"

  # Required bounded PR feedback for every non-documentation change. This is
  # deliberately not the semantic merge authority: exact acceptance remains
  # the unsplit full gate bound by the merge-receipt contract.
  static:
    name: static-and-focused
    needs: classify
    if: ${{ needs.classify.outputs.static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check every locked workspace target without linking
        run: cargo check --workspace --all-targets --locked

      - name: Run common qualification contract tests
        run: |
          node --test .github/ci/qualification.test.mjs
          node .github/ci/qualification.mjs check

      - name: Run L0/L1 focused controls
        if: ${{ needs.classify.outputs.l0_l1 == 'true' }}
        run: |
          node --check crates/oracle/l0-fixtures.mjs
          node crates/oracle/l0-fixtures.mjs --check
          node crates/oracle/l0-fixtures.mjs --smoke
          node --check crates/oracle/l0-option-inventory.mjs
          node crates/oracle/l0-option-inventory.mjs --check
          node --check crates/oracle/l0-performance.mjs
          node crates/oracle/l0-performance.mjs --check
          cargo test --locked \
            --manifest-path crates/compiler/Cargo.toml \
            --test contracts \
            l0_work_counters

      - name: Run H1 zero-cost H0 control
        if: ${{ needs.classify.outputs.h1 == 'true' }}
        run: >-
          cargo test --locked
          --manifest-path crates/compiler/Cargo.toml
          --test contracts
          frozen_h0_profile_matches_the_executable_boundaries

  # Platform-sensitive host/program changes retain focused Windows evidence.
  host_platform:
    name: host-windows-latest
    needs: classify
    if: ${{ needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.host_platform == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_TEST_THREADS: "2"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout filesystem-host sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run focused filesystem-host contracts
        run: >-
          cargo test --locked
          --manifest-path crates/host/Cargo.toml
          --test filesystem_host_contract

      - name: Run focused program filesystem contracts
        if: ${{ needs.classify.outputs.program_path == 'true' }}
        run: >-
          cargo test --locked
          --manifest-path crates/program/Cargo.toml
          --test host_platform_smoke_contract

  # L0.0 can only freeze deterministic large-edit inputs. L0/L1 runtime work
  # extends this scheduled lane with randomized edits, registry reclamation,
  # fresh/incremental exactness, cancellation, and bounded-RSS observations.
  scheduled_stress:
    name: scheduled-stress-inputs
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify and materialize frozen edit fixtures
        run: |
          node --check crates/oracle/l0-fixtures.mjs
          node crates/oracle/l0-fixtures.mjs --check
          node crates/oracle/l0-fixtures.mjs --smoke

  # One stable branch-protection context. Selected jobs must finish in a
  # known state; an absent, unknown, or unexpectedly skipped lane fails.
  gates:
    name: gates
    if: ${{ always() && github.event_name != 'schedule' }}
    needs:
      - classify
      - static
      - host_platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          STATIC: ${{ needs.classify.outputs.static }}
          STATIC_RESULT: ${{ needs.static.result }}
          HOST_PLATFORM: ${{ needs.classify.outputs.host_platform }}
          HOST_PLATFORM_RESULT: ${{ needs.host_platform.result }}
          PROGRAM_PATH: ${{ needs.classify.outputs.program_path }}
          L0_L1: ${{ needs.classify.outputs.l0_l1 }}
          H1: ${{ needs.classify.outputs.h1 }}
          SELECTION_SHA256: ${{ needs.classify.outputs.selection_sha256 }}
        run: |
          test "$CLASSIFY_RESULT" = success
          test "${#SELECTION_SHA256}" = 64
          for value in "$DOCS_ONLY" "$STATIC" "$HOST_PLATFORM" "$PROGRAM_PATH" "$L0_L1" "$H1"; do
            case "$value" in
              true|false) ;;
              *) exit 1 ;;
            esac
          done
          if [ "$PROGRAM_PATH" = true ]; then
            test "$HOST_PLATFORM" = true
          fi
          if [ "$DOCS_ONLY" = true ]; then
            test "$STATIC" = false
            test "$HOST_PLATFORM" = false
            test "$PROGRAM_PATH" = false
            test "$L0_L1" = false
            test "$H1" = false
            test "$STATIC_RESULT" = skipped
            test "$HOST_PLATFORM_RESULT" = skipped
          else
            test "$STATIC" = true
            test "$STATIC_RESULT" = success
            if [ "$HOST_PLATFORM" = true ]; then
              test "$HOST_PLATFORM_RESULT" = success
            else
              test "$HOST_PLATFORM_RESULT" = skipped
            fi
          fi
